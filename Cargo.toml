[package]
name = "thermostat-linkerd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Link Livisi floor heating zones to a Honeywell Lyric controlled heat pump via Home Assistant"
repository = "https://github.com/Arroquw/thermostat-linker"
license = "GPL-3.0-or-later"
readme = "README.md"

default-run = "thermostat-linkerd"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "http2", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"

[[bin]]
name = "thermostat-linkerd"
path = "src/main.rs"
